<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="amberGold" x1="140" y1="120" x2="372" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="diagonalShine" x1="140" y1="130" x2="372" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <filter id="softGlow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle gold border -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="8" />
  
  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)" />

  <!-- Builder Grid Matrix accents -->
  <circle cx="100" cy="100" r="3" fill="#FBBF24" fill-opacity="0.25" />
  <circle cx="412" cy="412" r="3" fill="#FBBF24" fill-opacity="0.25" />
  <circle cx="100" cy="412" r="3" fill="#FBBF24" fill-opacity="0.25" />
  <circle cx="412" cy="100" r="3" fill="#FBBF24" fill-opacity="0.25" />

  <!-- The Architectural 'N' Builder Monogram -->
  <g filter="url(#softGlow)">
    <!-- Left vertical bar -->
    <rect x="136" y="128" width="56" height="256" rx="8" fill="url(#amberGold)" />
    
    <!-- Right vertical bar -->
    <rect x="320" y="128" width="56" height="256" rx="8" fill="url(#amberGold)" />
    
    <!-- Diagonal traverse beam with rounded joints -->
    <path d="M136 136 C136 130 142 126 150 128 L192 128 L376 376 C380 382 376 388 368 388 L326 388 L142 140 C138 135 136 138 136 136 Z" fill="url(#diagonalShine)" />
    
    <!-- Architectural light facet on left column -->
    <path d="M136 136 L192 136 L192 210 L136 160 Z" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- Spark of innovation: 4-pointed builder star in upper right corner -->
    <path d="M396 86 Q396 112 422 112 Q396 112 396 138 Q396 112 370 112 Q396 112 396 86 Z" fill="#FDE68A" />
    <circle cx="396" cy="112" r="3" fill="#FFFFFF" />
  </g>
</svg>
